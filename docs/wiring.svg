<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1040" height="580" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="600" fill="#1a1a1a">Схема пайки — подсветка клавиатуры</text>
  <text x="40" y="74" font-size="15" fill="#666">Плата RP2040-Zero · модуль HW-532 (D4184 + PC817) · белая лента 5 В, 50 см</text>

  <!-- Плата -->
  <rect x="60" y="110" width="230" height="360" rx="14" fill="#f4f6f8" stroke="#2b3a46" stroke-width="2"/>
  <text x="175" y="146" font-size="18" font-weight="600" fill="#1a1a1a" text-anchor="middle">Плата</text>
  <text x="175" y="170" font-size="16" fill="#1a1a1a" text-anchor="middle">RP2040-Zero</text>
  <text x="175" y="196" font-size="13" fill="#666" text-anchor="middle">в неё USB-C с хаба</text>

  <circle cx="290" cy="250" r="9" fill="#d4372a"/>
  <text x="272" y="255" font-size="15" fill="#1a1a1a" text-anchor="end">5V</text>
  <circle cx="290" cy="310" r="9" fill="#333"/>
  <text x="272" y="315" font-size="15" fill="#1a1a1a" text-anchor="end">GND</text>
  <circle cx="290" cy="370" r="9" fill="#e0a000"/>
  <text x="272" y="375" font-size="15" fill="#1a1a1a" text-anchor="end">GP0</text>
  <circle cx="290" cy="430" r="9" fill="#333"/>
  <text x="272" y="435" font-size="15" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Модуль -->
  <rect x="430" y="110" width="230" height="360" rx="14" fill="#f4f6f8" stroke="#2b3a46" stroke-width="2"/>
  <text x="545" y="146" font-size="18" font-weight="600" fill="#1a1a1a" text-anchor="middle">Модуль HW-532</text>
  <text x="545" y="170" font-size="13" fill="#666" text-anchor="middle">ключ D4184, оптопара PC817</text>
  <text x="545" y="192" font-size="13" fill="#666" text-anchor="middle">коммутирует минус</text>

  <circle cx="430" cy="250" r="9" fill="#d4372a"/>
  <text x="448" y="255" font-size="15" fill="#1a1a1a">+</text>
  <circle cx="430" cy="310" r="9" fill="#333"/>
  <text x="448" y="315" font-size="15" fill="#1a1a1a">−</text>
  <circle cx="430" cy="370" r="9" fill="#e0a000"/>
  <text x="448" y="375" font-size="15" fill="#1a1a1a">PWM</text>
  <circle cx="430" cy="430" r="9" fill="#333"/>
  <text x="448" y="435" font-size="15" fill="#1a1a1a">GND</text>

  <circle cx="660" cy="250" r="9" fill="#d4372a"/>
  <text x="642" y="232" font-size="13" fill="#666" text-anchor="end">тот же контакт +</text>
  <circle cx="660" cy="430" r="9" fill="#333"/>
  <text x="642" y="435" font-size="15" fill="#1a1a1a" text-anchor="end">LOAD</text>
  <line x1="440" y1="250" x2="650" y2="250" stroke="#b9c2c9" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Лента -->
  <rect x="750" y="286" width="250" height="56" rx="8" fill="#fffdf0" stroke="#2b3a46" stroke-width="2"/>
  <g fill="#f0d264" stroke="#c9a227">
    <rect x="800" y="303" width="18" height="22" rx="3"/>
    <rect x="840" y="303" width="18" height="22" rx="3"/>
    <rect x="880" y="303" width="18" height="22" rx="3"/>
    <rect x="920" y="303" width="18" height="22" rx="3"/>
    <rect x="960" y="303" width="18" height="22" rx="3"/>
  </g>
  <circle cx="765" cy="300" r="7" fill="#d4372a"/>
  <circle cx="765" cy="330" r="7" fill="#333"/>
  <text x="782" y="304" font-size="13" fill="#1a1a1a">+</text>
  <text x="782" y="334" font-size="13" fill="#1a1a1a">−</text>
  <text x="875" y="370" font-size="15" fill="#1a1a1a" text-anchor="middle">Лента 5 В, 50 см</text>

  <!-- Провода плата -> модуль -->
  <line x1="290" y1="250" x2="430" y2="250" stroke="#d4372a" stroke-width="4"/>
  <line x1="290" y1="310" x2="430" y2="310" stroke="#333" stroke-width="4"/>
  <line x1="290" y1="370" x2="430" y2="370" stroke="#e0a000" stroke-width="4"/>
  <line x1="290" y1="430" x2="430" y2="430" stroke="#333" stroke-width="4"/>

  <!-- Провода модуль -> лента -->
  <polyline points="660,250 705,250 705,300 765,300" fill="none" stroke="#d4372a" stroke-width="4"/>
  <polyline points="660,430 720,430 720,330 765,330" fill="none" stroke="#333" stroke-width="4"/>

  <!-- Легенда и примечания -->
  <circle cx="70" cy="512" r="7" fill="#d4372a"/>
  <text x="86" y="517" font-size="14" fill="#1a1a1a">питание +5 В</text>
  <circle cx="220" cy="512" r="7" fill="#333"/>
  <text x="236" y="517" font-size="14" fill="#1a1a1a">земля и минус ленты</text>
  <circle cx="420" cy="512" r="7" fill="#e0a000"/>
  <text x="436" y="517" font-size="14" fill="#1a1a1a">сигнал яркости</text>

  <text x="60" y="548" font-size="13" fill="#666">У каждого контакта модуля два отверстия: в одно провод от платы, во второе — к ленте. PWM и GND с одного торца модуля, −, LOAD, + — с другого.</text>
</svg>
